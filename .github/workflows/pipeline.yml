name: CI

on:
  push:
jobs:
  analyze:
    name: Analyze

    runs-on: 'ubuntu-latest'
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python, actions
        build-mode: none
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run ruff
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest --cov=datalake_doco --cov-report markdown-append:$GITHUB_STEP_SUMMARY -v tests/

      - name: Export coverage
        run: uv run coverage lcov

      - uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.lcov

  build:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      # pyproject.toml keeps a placeholder; published versions are 0.1.<run number>.
      - name: Set version from build number
        run: uv version "0.1.${{ github.run_number }}" --no-sync

      - name: Build
        run: uv build

      # Install the built wheel, not the source tree, so missing package files fail here.
      - name: Smoke-test the installed CLI
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/python -c "import deltalake as d; d.DeltaTable.create('/tmp/lake/src/silver/t', d.Schema([d.Field('id', 'long')]))"
          /tmp/smoke/bin/datalake-doco generate /tmp/lake --output /tmp/out
          test -f /tmp/out/index.html && test -f /tmp/out/app.js && test -f /tmp/out/style.css && test -f /tmp/out/llms.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # required for PyPI trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v10.3.3

      # --check-url skips files PyPI already has, so re-running a workflow doesn't fail.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
